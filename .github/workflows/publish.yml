name: Publish wizardflow

# Trusted Publishing (OIDC) — no API tokens stored in GitHub.
# Configure the matching pending/active publishers on each index first:
#   PyPI:     https://pypi.org/manage/account/publishing/      (environment: pypi)
#   TestPyPI: https://test.pypi.org/manage/account/publishing/ (environment: testpypi)
# Use: owner=lkleonk, repo=wizardflow, workflow=publish.yml.
#
# Manual run (workflow_dispatch) -> TestPyPI, for end-to-end verification.
# Pushing a tag like v0.1.0       -> PyPI, the real release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: sdk/python

jobs:
  build:
    name: Build & verify distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run tests
        run: uv run --with pytest pytest -q

      - name: Build sdist and wheel
        run: uv build

      - name: Verify metadata renders on PyPI
        run: uvx twine check dist/*

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: sdk/python/dist/

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write   # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
