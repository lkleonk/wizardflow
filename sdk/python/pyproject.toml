[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "wizardflow"
version = "0.10.1"
description = "Python SDK for recording agent flows into the WizardFlow / AgentTrace file format."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Leon Koch" }]
keywords = ["agents", "langgraph", "tracing", "observability", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
wizardflow = "wizardflow.cli:main"

[project.urls]
Homepage = "https://getwizardflow.com"
Documentation = "https://github.com/lkleonk/wizardflow/tree/main/sdk/python/docs"
Source = "https://github.com/lkleonk/wizardflow"
Issues = "https://github.com/lkleonk/wizardflow/issues"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/wizardflow"]
artifacts = ["src/wizardflow/_ui/**"]

[tool.hatch.build.targets.sdist]
artifacts = ["src/wizardflow/_ui/**"]
# The README loads its images from GitHub; build_ui.py and the live-trace
# demo need the whole monorepo.
exclude = ["assets/", "scripts/"]
